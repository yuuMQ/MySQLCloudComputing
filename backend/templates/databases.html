<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Databases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <div>
        <span class="navbar-brand">Xin chào, {{ username }}</span>
        <a href="/" class="btn btn-outline-light">Trang chủ</a>
    </div>
    <div>
        <a href="/logout" class="btn btn-outline-light">Đăng xuất</a>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="text-center">Trang Database</h1>

    <form method="POST" action="/create_database" class="mt-3 row">
        <div class="col-auto">
            <input name="dbname" class="form-control" placeholder="Tên database">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary">Tạo database</button>
        </div>
    </form>

    <hr>

    <h3>Danh sách các database của bạn</h3>
    {% if database %}
        <ul class="list-group mt-3">
            {% for db in database %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div><b>Tên database: {{ db }}</b></div>
                    <div>
                        <a href="/database/{{ db }}" class="btn btn-sm btn-primary">Xem các bảng</a>
                        <a href="/drop_database/{{ db }}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Xóa database này?')">Xóa</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="text-muted mt-3">Không có database nào.</p>
    {% endif %}
</div>

</body>
</html>
