<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background: #f4f4f4;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin: 15px 0;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Đăng ký tài khoản mới</h2>

    <!-- HIỂN THỊ LỖI NGAY TRÊN TRANG ĐĂNG KÝ (rất quan trọng!) -->
    {% if error %}
        <div class="alert-danger">
            {{ error }}
        </div>
    {% endif %}

    {% if msg %}
        <div class="alert-success">
            {{ msg }}
        </div>
    {% endif %}

    <form method="POST">
        <label>Username:</label><br>
        <input type="text" name="username" pattern="^[A-Za-z0-9]+$" title="Username chỉ được chứa chữ và số, không có khoảng trắng hoặc ký tự đặc biệt."
               placeholder="Nhập tên login mà bạn muốn đăng ký"><br><br>

        <label>Password:</label><br>
        <input type="password" name="password"><br><br>

        <button class="btn btn-danger" type="submit">Đăng ký ngay</button>
    </form>

    <hr>
    <p>Đã có tài khoản? <a href="/login">Đăng nhập tại đây</a></p>
</div>
</body>
</html>
